{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate — Screenshotter</title>
  <link rel="stylesheet" href="/assets/bulma-1.0.2.min.css">
  <link rel="stylesheet" href="/assets/font-awesome-6.5.0.min.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    #editor { display: flex; flex-direction: column; height: 100vh; }

    /* ── Toolbar ─────────────────────────────────────── */
    #toolbar {
      background: #f5f5f5;
      border-bottom: 1px solid #dbdbdb;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      flex-shrink: 0;
      z-index: 10;
      flex-wrap: wrap;
    }
    .tool-btn {
      width: 40px; height: 40px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #555;
      font-size: 16px;
      transition: background 0.1s;
    }
    .tool-btn:hover { background: #e8e8e8; color: #222; }
    .tool-btn.is-active { background: #dbedff; border-color: #3273dc; color: #3273dc; }
    .tool-sep {
      height: 32px;
      border: none;
      border-left: 1px solid #dbdbdb;
      margin: 0 4px;
    }
    .swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
      outline: none;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.is-active { border-color: #333; box-shadow: 0 0 0 1px #fff inset; }
    .stroke-btn {
      width: 40px; height: 32px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .stroke-btn:hover { background: #e8e8e8; }
    .stroke-btn.is-active { background: #dbedff; border-color: #3273dc; }
    .stroke-line { background: #333; border-radius: 2px; width: 24px; }

    /* right-side action buttons */
    #toolbar-actions {
      margin-left: auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }
    .action-btn {
      width: 40px; height: 40px;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      color: #555;
    }
    .action-btn:hover { background: #f0f0f0; }
    .action-btn.is-save { background: #3273dc; border-color: #3273dc; color: white; }
    .action-btn.is-save:hover { background: #2366d1; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Canvas area ──────────────────────────────────── */
    #canvas-area {
      flex: 1;
      overflow: auto;
      /* checkerboard to show transparency */
      background-color: #999;
      background-image:
        linear-gradient(45deg, #bbb 25%, transparent 25%),
        linear-gradient(-45deg, #bbb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #bbb 75%),
        linear-gradient(-45deg, transparent 75%, #bbb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
  </style>
</head>
<body>
<div id="editor">

  <!-- ── Toolbar ──────────────────────────────────────── -->
  <div id="toolbar">
    <!-- Tools -->
    <button class="tool-btn is-active" data-tool="select" title="Select (V)">
      <i class="fa fa-arrow-pointer"></i>
    </button>
    <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
      <i class="fa-regular fa-square" style="font-size:14px"></i>
    </button>
    <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
      <i class="fa fa-arrow-right"></i>
    </button>
    <button class="tool-btn" data-tool="text" title="Text (T)">
      <span style="font-weight:700;font-size:17px;font-family:serif">T</span>
    </button>
    <button class="tool-btn" data-tool="redact" title="Redact (X) — solid black rectangle">
      <i class="fa fa-eye-slash" style="font-size:14px"></i>
    </button>

    <hr class="tool-sep">

    <!-- Color palette -->
    <button class="swatch is-active" data-color="#ef4444" style="background:#ef4444" title="Red"></button>
    <button class="swatch" data-color="#eab308" style="background:#eab308" title="Yellow"></button>
    <button class="swatch" data-color="#22c55e" style="background:#22c55e" title="Green"></button>
    <button class="swatch" data-color="#3b82f6" style="background:#3b82f6" title="Blue"></button>
    <button class="swatch" data-color="#111111" style="background:#111111" title="Black"></button>
    <button class="swatch" data-color="#ffffff" style="background:#ffffff;border-color:#aaa" title="White"></button>

    <hr class="tool-sep">

    <!-- Stroke width -->
    <button class="stroke-btn" data-sw="2" title="Thin">
      <div class="stroke-line" style="height:2px"></div>
    </button>
    <button class="stroke-btn is-active" data-sw="4" title="Medium">
      <div class="stroke-line" style="height:4px"></div>
    </button>
    <button class="stroke-btn" data-sw="7" title="Thick">
      <div class="stroke-line" style="height:7px"></div>
    </button>

    <hr class="tool-sep">

    <!-- Undo -->
    <button id="undo-btn" class="tool-btn" title="Undo (Ctrl+Z)">
      <i class="fa fa-rotate-left"></i>
    </button>

    <!-- Right-side actions -->
    <div id="toolbar-actions">
      <button id="cancel-btn" class="action-btn" title="Cancel">
        <i class="fa fa-xmark"></i>
      </button>
      <button id="save-btn" class="action-btn is-save" title="Save">
        <i class="fa fa-check"></i>
      </button>
    </div>
  </div>

  <!-- ── Canvas area ──────────────────────────────────── -->
  <div id="canvas-area">
    <canvas id="c"></canvas>
  </div>

</div>

<script src="/assets/fabric-5.3.0.min.js" nonce="{{.Nonce}}"></script>
<script nonce="{{.Nonce}}">
(function () {
  'use strict';

  const IMAGE_ID = '{{.Image.ID}}';
  const FONT_NAME = 'ScreenshotterAnnotation';
  const FONT_URL = '/static/font.ttf';

  // ── Cookie helpers ────────────────────────────────────
  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function setCookie(name, value) {
    var expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
  }

  // ── State ────────────────────────────────────────────
  let currentTool = 'select';
  let currentColor = '#ef4444';
  let currentStroke = 4;
  let history = [];   // JSON snapshots for undo
  let isDrawing = false;
  let drawStart = null;
  let activeObj = null;  // object being drawn (preview)
  let leaving = false;  // set true before intentional navigation to suppress beforeunload
  // Selection-edit state: tracks ambient color/stroke before an object is selected
  // so they can be restored (unless changed) when the object is deselected.
  let selectedObj = null;
  let savedColor = null;    // ambient color when selection started
  let savedStroke = null;   // ambient stroke when selection started
  let colorChangedDuringSel = false;
  let strokeChangedDuringSel = false;
  let rebuildingArrow = false;  // suppress selection events during arrow rebuild

  // ── Canvas init ──────────────────────────────────────
  const canvas = new fabric.Canvas('c', {
    backgroundColor: null,
    preserveObjectStacking: true,
    selection: true,
  });

  function initCanvas(img) {
    var area = document.getElementById('canvas-area');
    var canvasW = Math.max(area.clientWidth, img.width);
    var canvasH = Math.max(area.clientHeight, img.height);
    img.set({
      left: Math.floor((canvasW - img.width) / 2),
      top: Math.floor((canvasH - img.height) / 2),
      selectable: false, evented: false,
      hasControls: false,
      lockMovementX: true, lockMovementY: true,
      isBackground: true,
    });
    canvas.setWidth(canvasW);
    canvas.setHeight(canvasH);
    canvas.add(img);
    canvas.renderAll();
    pushHistory();
  }

  // Load font then image
  const fontFace = new FontFace(FONT_NAME, 'url(' + FONT_URL + ')');
  document.fonts.add(fontFace);
  fontFace.load().then(function () {
    fabric.Image.fromURL('/' + IMAGE_ID + '.png', function (img) {
      initCanvas(img);
    }, { crossOrigin: 'anonymous' });
  }).catch(function () {
    // Font failed to load — proceed without custom font.
    fabric.Image.fromURL('/' + IMAGE_ID + '.png', function (img) {
      initCanvas(img);
    }, { crossOrigin: 'anonymous' });
  });

  // ── History ──────────────────────────────────────────
  function pushHistory() {
    history.push(canvas.toJSON(['isBackground', 'arrowX1', 'arrowY1', 'arrowX2', 'arrowY2', 'arrowLeft0', 'arrowTop0']));
  }

  function undo() {
    if (history.length <= 1) return;
    restoreToolbarIfNeeded();
    selectedObj = null;
    history.pop();
    canvas.loadFromJSON(history[history.length - 1], function () {
      canvas.forEachObject(function (obj) {
        if (obj.isBackground) {
          obj.set({ selectable: false, evented: false });
        }
      });
      canvas.renderAll();
    });
  }

  // ── Tool management ──────────────────────────────────
  function setTool(tool) {
    if (currentTool === 'select' && tool !== 'select') {
      restoreToolbarIfNeeded();
      selectedObj = null;
    }
    currentTool = tool;
    canvas.isDrawingMode = false;
    canvas.selection = (tool === 'select');

    canvas.forEachObject(function (obj) {
      if (!obj.isBackground) {
        obj.selectable = (tool === 'select');
        obj.evented = (tool === 'select');
      }
    });

    var cursors = { select: 'default', rect: 'crosshair', arrow: 'crosshair', text: 'text' };
    canvas.defaultCursor = cursors[tool] || 'default';
    canvas.hoverCursor = (tool === 'select') ? 'move' : (cursors[tool] || 'default');

    document.querySelectorAll('.tool-btn[data-tool]').forEach(function (btn) {
      btn.classList.toggle('is-active', btn.dataset.tool === tool);
    });
    setCookie('annotate_tool', tool);
  }

  function setColor(color) {
    currentColor = color;
    showColorInToolbar(color);
    setCookie('annotate_color', color);
    if (selectedObj) {
      colorChangedDuringSel = true;
      applyColorToObject(selectedObj, color);
      pushHistory();
    }
  }

  function setStroke(w) {
    currentStroke = w;
    showStrokeInToolbar(w);
    setCookie('annotate_stroke', String(w));
    if (selectedObj) {
      strokeChangedDuringSel = true;
      selectedObj = applyStrokeToObject(selectedObj, w);
      pushHistory();
    }
  }

  // ── Wire toolbar buttons ─────────────────────────────
  document.querySelectorAll('.tool-btn[data-tool]').forEach(function (btn) {
    btn.addEventListener('click', function () { setTool(btn.dataset.tool); });
  });
  document.querySelectorAll('.swatch[data-color]').forEach(function (swatch) {
    swatch.addEventListener('click', function () { setColor(swatch.dataset.color); });
  });
  document.querySelectorAll('.stroke-btn[data-sw]').forEach(function (btn) {
    btn.addEventListener('click', function () { setStroke(parseInt(btn.dataset.sw, 10)); });
  });
  document.getElementById('undo-btn').addEventListener('click', undo);
  document.getElementById('cancel-btn').addEventListener('click', cancelAnnotate);
  document.getElementById('save-btn').addEventListener('click', saveAnnotation);

  // ── Restore preferences from cookies ─────────────────
  (function () {
    var tool = getCookie('annotate_tool');
    if (tool && document.querySelector('.tool-btn[data-tool="' + tool + '"]')) {
      setTool(tool);
    }
    var color = getCookie('annotate_color');
    if (color) {
      var swatch = document.querySelector('.swatch[data-color="' + color + '"]');
      if (swatch) setColor(color);
    }
    var stroke = getCookie('annotate_stroke');
    if (stroke) {
      var sw = parseInt(stroke, 10);
      var strokeBtn = document.querySelector('.stroke-btn[data-sw="' + sw + '"]');
      if (strokeBtn) setStroke(sw);
    }
  }());

  // ── Arrow helper ─────────────────────────────────────
  function makeArrow(x1, y1, x2, y2, color, sw) {
    var angle = Math.atan2(y2 - y1, x2 - x1);
    var headSize = Math.max(14, sw * 4);

    // End the line at the arrowhead base (wings are at ±30°, so base is cos(π/6) back from tip).
    var baseOffset = headSize * Math.cos(Math.PI / 6);
    var lx2 = x2 - baseOffset * Math.cos(angle);
    var ly2 = y2 - baseOffset * Math.sin(angle);

    var line = new fabric.Polyline([{ x: x1, y: y1 }, { x: lx2, y: ly2 }], {
      stroke: color, strokeWidth: sw,
      fill: 'transparent',
      selectable: false, evented: false,
    });

    var hx = x2, hy = y2;
    var head = new fabric.Polygon([
      { x: hx, y: hy },
      { x: hx - headSize * Math.cos(angle - Math.PI / 6), y: hy - headSize * Math.sin(angle - Math.PI / 6) },
      { x: hx - headSize * Math.cos(angle + Math.PI / 6), y: hy - headSize * Math.sin(angle + Math.PI / 6) },
    ], {
      fill: color, stroke: color, strokeWidth: 1,
      selectable: false, evented: false,
    });

    var group = new fabric.Group([line, head], { selectable: true, evented: true });
    // Store arrow endpoints so they can be used when rebuilding after a stroke-width change.
    // arrowLeft0/arrowTop0 track the group's origin at the time of the last update so that
    // any translation by the user can be added as an offset when computing current coordinates.
    group.arrowX1 = x1; group.arrowY1 = y1;
    group.arrowX2 = x2; group.arrowY2 = y2;
    group.arrowLeft0 = group.left; group.arrowTop0 = group.top;
    return group;
  }

  // ── Toolbar display helpers ──────────────────────────
  function showColorInToolbar(color) {
    document.querySelectorAll('.swatch').forEach(function (s) {
      s.classList.toggle('is-active', s.dataset.color === color);
    });
  }

  function showStrokeInToolbar(sw) {
    document.querySelectorAll('.stroke-btn').forEach(function (s) {
      s.classList.toggle('is-active', parseInt(s.dataset.sw, 10) === sw);
    });
  }

  // ── Read/write color and stroke on canvas objects ────
  function getObjectColor(obj) {
    if (obj.type === 'group') {
      var ln = obj._objects.find(function (o) { return o.type === 'polyline'; });
      return ln ? ln.stroke : null;
    }
    if (obj.type === 'rect' && obj.fill === 'transparent') return obj.stroke;
    if (obj.type === 'i-text') return obj.fill;
    return null;
  }

  function getObjectStrokeWidth(obj) {
    if (obj.type === 'group') {
      var ln = obj._objects.find(function (o) { return o.type === 'polyline'; });
      return ln ? ln.strokeWidth : null;
    }
    if (obj.type === 'rect' && obj.fill === 'transparent') return obj.strokeWidth;
    return null;
  }

  function applyColorToObject(obj, color) {
    if (obj.type === 'group') {
      obj._objects.forEach(function (child) {
        if (child.type === 'polyline') child.set({ stroke: color });
        else if (child.type === 'polygon') child.set({ fill: color, stroke: color });
      });
      obj.dirty = true;
    } else if (obj.type === 'rect' && obj.fill === 'transparent') {
      obj.set({ stroke: color });
    } else if (obj.type === 'i-text') {
      obj.set({ fill: color });
    }
    canvas.renderAll();
  }

  // Rebuilds an arrow group with a new stroke width, replacing it in the canvas and
  // returning the new group. For other object types, updates strokeWidth in place.
  function applyStrokeToObject(obj, sw) {
    if (obj.type === 'group' && obj.arrowX1 !== undefined) {
      var ln = obj._objects.find(function (o) { return o.type === 'polyline'; });
      var color = ln ? ln.stroke : currentColor;
      var dx = obj.left - obj.arrowLeft0, dy = obj.top - obj.arrowTop0;
      var newArrow = makeArrow(obj.arrowX1 + dx, obj.arrowY1 + dy, obj.arrowX2 + dx, obj.arrowY2 + dy, color, sw);
      newArrow.set({ selectable: true, evented: true });
      rebuildingArrow = true;
      canvas.remove(obj);
      canvas.add(newArrow);
      canvas.setActiveObject(newArrow);
      canvas.renderAll();
      rebuildingArrow = false;
      return newArrow;
    }
    if (obj.type === 'rect' && obj.fill === 'transparent') {
      obj.set({ strokeWidth: sw });
      canvas.renderAll();
    }
    return obj;
  }

  // ── Selection state management ───────────────────────
  function onObjectSelected(obj) {
    if (!obj || obj.isBackground) { selectedObj = null; return; }
    selectedObj = obj;
    savedColor = currentColor;
    savedStroke = currentStroke;
    colorChangedDuringSel = false;
    strokeChangedDuringSel = false;
    var c = getObjectColor(obj);
    var s = getObjectStrokeWidth(obj);
    if (c !== null) { currentColor = c; showColorInToolbar(c); }
    if (s !== null) { currentStroke = s; showStrokeInToolbar(s); }
  }

  // Restores pre-selection toolbar values for any dimension the user did not change
  // while the object was selected, then clears the saved state.
  function restoreToolbarIfNeeded() {
    if (savedColor === null) return;
    if (!colorChangedDuringSel) { currentColor = savedColor; showColorInToolbar(savedColor); }
    if (!strokeChangedDuringSel) { currentStroke = savedStroke; showStrokeInToolbar(savedStroke); }
    savedColor = null;
    savedStroke = null;
    colorChangedDuringSel = false;
    strokeChangedDuringSel = false;
  }

  // ── Drawing events ───────────────────────────────────
  canvas.on('mouse:down', function (opt) {
    if (currentTool === 'select') return;

    var ptr = canvas.getPointer(opt.e);

    if (currentTool === 'text') {
      var text = new fabric.IText('Text', {
        left: ptr.x, top: ptr.y,
        fontSize: 20,
        fontFamily: FONT_NAME,
        fill: currentColor,
        selectable: true, evented: true,
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      text.enterEditing();
      text.selectAll();
      canvas.renderAll();
      text.on('editing:exited', function () {
        if (!text.text || text.text === '') {
          canvas.remove(text);
        }
        pushHistory();
      });
      return;
    }

    isDrawing = true;
    drawStart = { x: ptr.x, y: ptr.y };

    if (currentTool === 'rect') {
      activeObj = new fabric.Rect({
        left: ptr.x, top: ptr.y, width: 1, height: 1,
        fill: 'transparent',
        stroke: currentColor, strokeWidth: currentStroke,
        selectable: false, evented: false,
      });
      canvas.add(activeObj);
    } else if (currentTool === 'redact') {
      activeObj = new fabric.Rect({
        left: ptr.x, top: ptr.y, width: 1, height: 1,
        fill: '#111111', stroke: 'transparent', strokeWidth: 0,
        selectable: false, evented: false,
      });
      canvas.add(activeObj);
    } else if (currentTool === 'arrow') {
      activeObj = makeArrow(ptr.x, ptr.y, ptr.x + 1, ptr.y, currentColor, currentStroke);
      canvas.add(activeObj);
    }
  });

  canvas.on('mouse:move', function (opt) {
    if (!isDrawing || !activeObj) return;
    var ptr = canvas.getPointer(opt.e);

    if (currentTool === 'rect' || currentTool === 'redact') {
      activeObj.set({
        left: Math.min(drawStart.x, ptr.x),
        top: Math.min(drawStart.y, ptr.y),
        width: Math.abs(ptr.x - drawStart.x),
        height: Math.abs(ptr.y - drawStart.y),
      });
    } else if (currentTool === 'arrow') {
      canvas.remove(activeObj);
      activeObj = makeArrow(drawStart.x, drawStart.y, ptr.x, ptr.y, currentColor, currentStroke);
      canvas.add(activeObj);
    }
    canvas.renderAll();
  });

  canvas.on('mouse:up', function () {
    if (!isDrawing) return;
    isDrawing = false;

    if (activeObj) {
      activeObj.setCoords();
      activeObj.set({ selectable: false, evented: false });
      activeObj = null;
      pushHistory();
    }
  });

  // Push history after moving/scaling existing objects; keep stored arrow endpoints in sync.
  canvas.on('object:modified', function (opt) {
    var obj = opt.target;
    if (obj && obj.arrowX1 !== undefined) {
      var dx = obj.left - obj.arrowLeft0, dy = obj.top - obj.arrowTop0;
      if (dx !== 0 || dy !== 0) {
        obj.arrowX1 += dx; obj.arrowY1 += dy;
        obj.arrowX2 += dx; obj.arrowY2 += dy;
        obj.arrowLeft0 = obj.left; obj.arrowTop0 = obj.top;
      }
    }
    pushHistory();
  });

  // ── Selection: reflect/edit object color and stroke ──
  canvas.on('selection:created', function () {
    if (rebuildingArrow) return;
    var objs = canvas.getActiveObjects();
    if (objs.length === 1) onObjectSelected(objs[0]);
    else selectedObj = null;
  });

  canvas.on('selection:updated', function () {
    if (rebuildingArrow) return;
    restoreToolbarIfNeeded();
    var objs = canvas.getActiveObjects();
    if (objs.length === 1) onObjectSelected(objs[0]);
    else selectedObj = null;
  });

  canvas.on('selection:cleared', function () {
    if (rebuildingArrow) return;
    restoreToolbarIfNeeded();
    selectedObj = null;
  });

  // ── Content bounding box ──────────────────────────────
  // Returns the union bounding rect of all canvas objects, clamped to the
  // canvas bounds.
  function getContentBoundingBox() {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    canvas.forEachObject(function (obj) {
      var r = obj.getBoundingRect(true, true);
      minX = Math.min(minX, r.left);
      minY = Math.min(minY, r.top);
      maxX = Math.max(maxX, r.left + r.width);
      maxY = Math.max(maxY, r.top + r.height);
    });
    minX = Math.max(0, Math.floor(minX));
    minY = Math.max(0, Math.floor(minY));
    maxX = Math.min(canvas.getWidth(), Math.ceil(maxX));
    maxY = Math.min(canvas.getHeight(), Math.ceil(maxY));
    return { left: minX, top: minY, width: maxX - minX, height: maxY - minY };
  }

  // ── Save ─────────────────────────────────────────────
  function saveAnnotation() {
    var saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;

    // Deselect to hide transform handles
    canvas.discardActiveObject();
    canvas.renderAll();

    var bb = getContentBoundingBox();
    var full = canvas.toCanvasElement();
    var crop = document.createElement('canvas');
    crop.width = bb.width;
    crop.height = bb.height;
    crop.getContext('2d').drawImage(full, bb.left, bb.top, bb.width, bb.height, 0, 0, bb.width, bb.height);
    crop.toBlob(function (blob) {
      fetch('/' + IMAGE_ID + '/annotate', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'image/png', 'X-Screenshotter-Request': '1' },
        body: blob,
      }).then(function (resp) {
        if (resp.ok) {
          leaving = true;
          window.location.href = '/' + IMAGE_ID;
        } else {
          return resp.json().catch(function () { return {}; }).then(function (j) {
            alert('Save failed: ' + (j.error || resp.status));
            saveBtn.disabled = false;
          });
        }
      }).catch(function () {
        alert('Network error while saving.');
        saveBtn.disabled = false;
      });
    }, 'image/png');
  }

  // ── Cancel ────────────────────────────────────────────
  function cancelAnnotate() {
    leaving = true;
    window.location.href = '/' + IMAGE_ID;
  }

  // Warn before leaving with unsaved changes (e.g. accidental tab close or navigation).
  window.addEventListener('beforeunload', function (e) {
    if (!leaving && history.length > 1) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ── Keyboard shortcuts ────────────────────────────────
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    // Don't intercept keys while typing in a Fabric IText
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault();
      undo();
      return;
    }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === 'v' || e.key === 'Escape') { setTool('select'); return; }
      if (e.key === 'r') { setTool('rect'); return; }
      if (e.key === 'a') { setTool('arrow'); return; }
      if (e.key === 't') { setTool('text'); return; }
      if (e.key === 'x') { setTool('redact'); return; }
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      var active = canvas.getActiveObject();
      if (active && !active.isBackground && active.type !== 'i-text') {
        canvas.remove(active);
        canvas.discardActiveObject();
        canvas.renderAll();
        pushHistory();
      }
    }
  });

}());
