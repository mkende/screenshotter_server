{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}Screenshotter{{end}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  {{block "head" .}}{{end}}
</head>
<body>
  <nav class="navbar is-white has-shadow" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-semibold is-size-5" href="/">Screenshotter</a>
    </div>
    <div class="navbar-menu">
      {{block "navbar-start" .}}{{end}}
      <div class="navbar-end">
        {{block "navbar-end" .}}{{end}}
        {{if .User}}
        <div class="navbar-item">
          <span class="has-text-grey">{{.User.DisplayName}}</span>
        </div>
        <div class="navbar-item">
          <a class="button is-light is-small" href="/auth/logout">Log out</a>
        </div>
        {{end}}
      </div>
    </div>
  </nav>
  <main class="section">
    <div class="container">
      {{block "content" .}}{{end}}
    </div>
  </main>
</body>
</html>
{{end}}
